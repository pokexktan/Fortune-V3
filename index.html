<h1>🙏 摇签 🙏</h1>

<p>请先掷杯</p>

<button id="cupBtn">掷杯</button>

<button id="drawBtn" style="display:none">摇签</button>

<button id="resetBtn" style="display:none">重新开始</button>

<div id="cup"></div>

<div id="result" class="card">
祝你好运🍀

let cup=document.getElementById("cup")
let result=document.getElementById("result")
let cupBtn=document.getElementById("cupBtn")
let drawBtn=document.getElementById("drawBtn")
let resetBtn=document.getElementById("resetBtn")

cupBtn.onclick=ask
drawBtn.onclick=draw
resetBtn.onclick=reset

function ask(){

let r=Math.random()

if(r<0.2){

cup.innerHTML="😄 笑杯"
result.innerHTML="未明示，请换个问题或继续掷杯"

}
else if(r<0.4){

cup.innerHTML="😐 阴杯"
result.innerHTML="不同意，请换个问题再掷杯"

}
else{

cup.innerHTML="🙏 圣杯"
result.innerHTML="允许，请摇签"

cupBtn.style.display="none"
drawBtn.style.display="inline-block"

}

}

function draw(){

"<div class='poem'>"+f.poem+"</div>"+
"<p><b>解签：</b>"+f.interpretation+"</p>"

drawBtn.style.display="none"
resetBtn.style.display="inline-block"

}

function reset(){

cup.innerHTML=""
result.innerHTML="请先掷杯"

cupBtn.style.display="inline-block"
drawBtn.style.display="none"
resetBtn.style.display="none"

}
